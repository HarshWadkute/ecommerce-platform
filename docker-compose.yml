services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ecommerce_pg_data: